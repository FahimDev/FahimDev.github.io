<!DOCTYPE html>
<!--
    `seo-snapshot`   -> pre-React static snapshot is visible (default state
                         for crawlers / noscript / users with JS disabled).
    `seo-snapshot--js` -> pre-React snapshot is hidden (set synchronously by
                         the inline script below as soon as the JS engine is
                         available, so the React app can render without the
                         snapshot text flashing underneath it).
-->
<html lang="en" class="seo-snapshot">
    <head>
        <script>
            // Synchronous class flip — runs before <body> is parsed, so no
            // flash of the SEO snapshot is possible for users with JS on.
            // For crawlers / noscript users the class stays as "seo-snapshot"
            // and the <main id="seo-snapshot">…</main> block (injected by
            // scripts/prerender.mjs) stays visible.
            document.documentElement.classList.replace("seo-snapshot", "seo-snapshot--js");
        </script>
        <meta charset="UTF-8" />
